
name: Build Asetku APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip asetku_flutter_starter.zip -d .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android files
        working-directory: asetku
        run: |
          flutter create --platforms=android --org com.asetku .
          rm -f test/widget_test.dart

      - name: Ensure Android Internet Permission
        working-directory: asetku
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if "android.permission.INTERNET" not in content:
              if "<application" not in content:
                  raise SystemExit("Tag application tidak ditemukan")
              content = content.replace(
                  "<application",
                  f"    {permission}\n    <application",
                  1
              )
              path.write_text(content)

          print("Internet permission tersedia.")
          PY

      - name: Verify Android Manifest
        working-directory: asetku
        run: |
          grep -n "uses-permission\|INTERNET\|application" android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        working-directory: asetku
        run: flutter pub get

      - name: Configure analysis options
        working-directory: asetku
        run: |
          cat << 'EOF' > analysis_options.yaml
          include: package:flutter_lints/flutter.yaml

          analyzer:
            errors:
              deprecated_member_use: ignore
          EOF

      - name: Analyze
        working-directory: asetku
        run: flutter analyze

      - name: Build APK
        working-directory: asetku
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASETKU-APK
          path: asetku/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
