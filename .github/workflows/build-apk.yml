name: Build Asetku APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip asetku_flutter_starter.zip -d .

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android files
        working-directory: asetku
        run: |
          flutter create --platforms=android --org com.asetku.v2 .
          rm -f test/widget_test.dart

      - name: Configure permanent APK signing
        working-directory: asetku
        env:
          ASETKU_KEYSTORE_BASE64: ${{ secrets.ASETKU_KEYSTORE_BASE64 }}
          ASETKU_KEY_ALIAS: ${{ secrets.ASETKU_KEY_ALIAS }}
          ASETKU_STORE_PASSWORD: ${{ secrets.ASETKU_STORE_PASSWORD }}
          ASETKU_KEY_PASSWORD: ${{ secrets.ASETKU_KEY_PASSWORD }}
        run: |
          set -e
          echo "$ASETKU_KEYSTORE_BASE64" | base64 --decode > android/app/asetku-release.jks
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("File Gradle aplikasi tidak ditemukan")

          text = gradle.read_text()
          is_kts = gradle.suffix == ".kts"
          app_id = "com.asetku.v2.asetku"

          if is_kts:
              text, count = re.subn(r'applicationId\s*=\s*"[^"]+"', f'applicationId = "{app_id}"', text, count=1)
          else:
              text, count = re.subn(r'applicationId\s+"[^"]+"', f'applicationId "{app_id}"', text, count=1)
          if count != 1:
              raise SystemExit("applicationId tidak ditemukan di defaultConfig")

          if is_kts:
              signing = '''
          signingConfigs {
              create("release") {
                  keyAlias = System.getenv("ASETKU_KEY_ALIAS")
                  keyPassword = System.getenv("ASETKU_KEY_PASSWORD")
                  storeFile = file("asetku-release.jks")
                  storePassword = System.getenv("ASETKU_STORE_PASSWORD")
              }
          }
          '''
              release_line = 'signingConfig = signingConfigs.getByName("release")'
          else:
              signing = '''
          signingConfigs {
              release {
                  keyAlias System.getenv("ASETKU_KEY_ALIAS")
                  keyPassword System.getenv("ASETKU_KEY_PASSWORD")
                  storeFile file("asetku-release.jks")
                  storePassword System.getenv("ASETKU_STORE_PASSWORD")
              }
          }
          '''
              release_line = 'signingConfig signingConfigs.release'

          pattern = r'(buildTypes\s*\{\s*(?:getByName\("release"\)|release)\s*\{)'
          if "asetku-release.jks" in text or re.search(pattern, text) is None:
              raise SystemExit("Struktur buildTypes release tidak sesuai; hentikan build agar aman")

          text = re.sub(pattern, r'\1\n            ' + release_line, text, count=1)
          text, count = re.subn(r'\n\s*buildTypes\s*\{', '\n' + signing + '\n        buildTypes {', text, count=1)
          if count != 1:
              raise SystemExit("Lokasi signingConfigs tidak ditemukan")

          gradle.write_text(text)
          print(f"Signing permanen dikonfigurasi pada {gradle}")
          print(f"Application ID baru: {app_id}")
          PY
          keytool -list -keystore android/app/asetku-release.jks -storepass "$ASETKU_STORE_PASSWORD" -alias "$ASETKU_KEY_ALIAS" >/dev/null
          echo "Keystore valid."

      - name: Ensure Android Internet Permission
        working-directory: asetku
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if "android.permission.INTERNET" not in content:
              if "<application" not in content:
                  raise SystemExit("Tag application tidak ditemukan")
              content = content.replace("<application", f"    {permission}\n    <application", 1)
              path.write_text(content)
          print("Internet permission tersedia.")
          PY

      - name: Install dependencies
        working-directory: asetku
        run: flutter pub get

      - name: Configure analysis options
        working-directory: asetku
        run: |
          cat << 'EOF' > analysis_options.yaml
          include: package:flutter_lints/flutter.yaml

          analyzer:
            errors:
              deprecated_member_use: ignore
          EOF

      - name: Analyze
        working-directory: asetku
        run: flutter analyze

      - name: Build APK
        working-directory: asetku
        env:
          ASETKU_KEY_ALIAS: ${{ secrets.ASETKU_KEY_ALIAS }}
          ASETKU_STORE_PASSWORD: ${{ secrets.ASETKU_STORE_PASSWORD }}
          ASETKU_KEY_PASSWORD: ${{ secrets.ASETKU_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASETKU-APK-BARU
          path: asetku/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
