name: Asetku Android APK

concurrency:
  group: asetku-android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - uses: actions/setup-java@v4
        name: Setup Java
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        name: Setup Flutter
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files if needed
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create --platforms=android --org com.asetku --project-name asetku .
          fi
      - name: Set Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')]
          found = False
          for path in candidates:
              if not path.exists():
                  continue
              source = path.read_text()
              updated = source.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 36')
              updated = updated.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 36')
              if updated != source:
                  path.write_text(updated)
                  found = True
                  print(f'Updated compile SDK to 36 in {path}')
              elif 'compileSdk = 36' in source or 'compileSdkVersion 36' in source:
                  found = True
          if not found:
              raise SystemExit('Could not set Android compile SDK to 36 in app Gradle file')
          PY
      - name: Install packages
        run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build release APK
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build gagal; mencoba ulang setelah jeda untuk mengatasi gangguan unduhan dependency."
              sleep 30
            fi
          done
          exit 1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asetku-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
